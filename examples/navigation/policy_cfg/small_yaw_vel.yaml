# Velocity-command variant of small_yaw: same network, but action[:3] is a
# velocity setpoint in m/s (START frame) through VelocityBoundedYaw instead
# of a thrust vector. The bounds must stay aligned with what the deployment
# sends PX4 (superfly registry --max-vel-xy / --max-vel-z). Pair with the
# *_vel train/eval configs -- VELOCITY_YAW requires the dynamics'
# velocity_world_frame mode (asserted in NavigationEnv).
policy_class: MultiInputPolicy
policy:
  feature_extractor_class: StateTargetImageExtractor
  feature_extractor_kwargs:
    activation_fn: leaky_relu
    net_arch:
      state:
        mlp_layer: [192]
        bn: False
        ln: True
      target:
        mlp_layer: [192]
        bn: False
        ln: True
      depth:
        input_max_pool_H_W: [12, 16]
        kernel_size: [2, 3, 3]
        channels: [32, 64, 128]
        padding: [0, 0, 0]
        stride: [1, 1, 1]
        cnn_bn: False
        mlp_layer: [192]
        bn: False
        ln: True
      concatenate: False
  net_arch:
    recurrent:
      class: GRUCell
      kwargs:
        hidden_size: 192
    mlp_layer: [4]
  activation_fn: leaky_relu
  output_activation_fn: velocity_bounded_yaw
  output_activation_kwargs:
    max_vel_xy: 2.5
    max_vel_z: 1.5
  device: cuda

update_env_kwargs:
  action_type: VELOCITY_YAW
  inertial_frame: START
  target_type: TARGET_VELOCITY_TARGET_DISTANCE
