# nav_levelX for the PLANAR velocity-command variant: as nav_levelX_vel, but
# spawn altitude pinned to the target altitude and gravity-z randomization
# off (the activation forces vz==0; see small_yaw_vel_planar.yaml).
# Original header:
# Differences from nav_levelX: velocity_world_frame dynamics (explicit PX4
# velocity loop + starling accel box / rotor lag, constants from superfly
# configs/vehicles/starling2max.yaml), target_speed uniform over
# [0.8, 1.5] m/s (Uniform spans mean +/- half/2), and max_episode_steps 900
# -- at the 0.8 m/s floor the far spawns (~12.5 m) need ~16 s = 780 steps
# at 50 Hz, which the thrust variant's 600 would truncate.
env_class: navigation_env
env:
  num_envs: 16
  seed: 42
  visual: True
  single_env: True
  base_action: [0., 0., 0.]
  robot_radius: 0.3
  random_kwargs:
    safe_spawn_radius: 0.1
    min_starting_distance_to_target: 0.1
    position:
      class: cylinder
      mean: [0., 0., 1.5]
      half: [12.5, 12.5, 0.]
    velocity:
      class: uniform
      mean: [0., 0., 0.]
      half: [0.5, 0.5, 0.5]
    rotation:
      class: normal
      mean: [0., 0., 0.]
      half: [0., 0., 0.2]
    target:
      class: uniform
      mean: [0., 0., 1.5]
      half: [0., 0., 0.]
    target_speed:
      class: uniform
      mean: [1.15]
      half: [0.7]
    velocity_noise:
      class: normal
      mean: [0., 0., 0.]
      half: [0.05, 0.05, 0.05]
    rotation_noise:
      class: normal
      mean: [0., 0., 0.]
      half: [0.02, 0.02, 0.02]
    gravity:
      class: normal
      mean: [0., 0., -9.81]
      half: [0., 0., 0.]   # planar: vz==0 cannot correct hover-thrust drift
  dynamics_kwargs:
    action_type: velocity_world_frame
    dt: 0.02
    ctrl_dt: 0.02
    ctrl_delay: 0.0
    grad_decay: 0.92
    avg_velocity_window_dt: 2.0
    vel_smoothing_factor: 0.8
    exp_smoothing_factor: 12.
    enable_ctrl_smoothing: False
    enable_air_drag: False
    air_drag_theta_1: 0.1
    air_drag_theta_2: 0.1
    # PX4 velocity-loop P gains (MPC_XY_VEL_P_ACC / MPC_Z_VEL_P_ACC defaults)
    vel_p_gain_xy: 1.8
    vel_p_gain_z: 4.0
    # starling2max accel box (T/W 2.0 assumption): xy g*sqrt(3), z 2g
    max_acc_xy: 17.0
    min_acc_z: 0.5
    max_acc_z: 19.6
    # rotor lag rate 1/tau, sys-ID tau 85..55 ms
    motor_lag_lmbda: [11.8, 18.2]
  scene_kwargs:
    path: configs/level_1
    reload_scenes: True
    load_geodesics: True
    spawn_obstacles: False
  sensor_kwargs:
    - sensor_type: depth
      uuid: depth
      resolution: [72, 128] # (H, W)
      position: [0.1, -0.02, -0.04] # eris02 extrinsics
      orientation: [0, 0, 0]
      far: 20.
      near: 0.25
  target_kwargs:
    success_radius: 0.1
  reward_kwargs:
    beta_1: 2.5
    beta_2: -6 # bnl -32
    lambda_v: 4
    lambda_c: 6 # bnl 2
    lambda_a: 0.01
    lambda_j: 0.001
    lambda_om: 0.3
    lambda_yaw: 4.0
    lambda_vmax: 1.0
    falloff_dis: 1.0
  max_episode_steps: 900
  device: cpu


train_bptt:
  iterations: 1000
  learning_rate_init: 0.001
  learning_rate_final: 0.0005
  weight_decay: 0.01
  horizon: 150
  gamma: 1.0
  log_interval: 100
  checkpoint_interval: 500
  early_stop_reward_threshold: -150
  device: cuda
